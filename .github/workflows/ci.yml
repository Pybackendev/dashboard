name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql+psycopg://dashboard:dashboard@localhost:5432/dashboard_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Run tests
        working-directory: app
        run: python -m pytest -q
      - name: Build application image
        run: docker build -t shop-dashboard:ci ./app
