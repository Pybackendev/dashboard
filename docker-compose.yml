services:
  # --- Тестовый магазин OpenCart и его БД ---
  opencart-db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: master_password
      MYSQL_DATABASE: opencart
      MYSQL_USER: opencart
      MYSQL_PASSWORD: opencart_pass
    volumes:
      - opencart_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  opencart:
    image: aamservices/opencart:latest
    depends_on:
      opencart-db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - opencart_data:/var/www/html

  # --- База дашборда ---
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Дашборд (FastAPI + Chart.js) ---
  app:
    build: ./app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/frontend
    restart: unless-stopped

volumes:
  opencart_db_data:
  opencart_data:
  postgres_data:
